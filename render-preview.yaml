services:
  - type: web
    name: atena-ai-coach-preview
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/shrek9999/atena-mvp
    branch: feature/camera-v2-contract
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: ATENA_DATABASE_URL
        fromDatabase:
          name: atena-preview-db
          property: connectionString
      - key: AI_COACH_TEST_TOKEN
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: AI_COACH_TEST_TOKEN
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: GEMINI_MODEL
      - key: ATENA_DATA_STORAGE_ENABLED
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: ATENA_DATA_STORAGE_ENABLED
      - key: ATENA_PRIVACY_NOTICE_APPROVED
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: ATENA_PRIVACY_NOTICE_APPROVED
      - key: ATENA_PRIVACY_NOTICE_VERSION
        fromService:
          type: web
          name: atena-ai-coach-pilot
          envVarKey: ATENA_PRIVACY_NOTICE_VERSION
      - key: ATENA_MAX_REQUEST_BYTES
        value: "65536"

services:
  - type: web
    name: atena-mvp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health

  - type: web
    name: atena-mcp
    runtime: python
    buildCommand: pip install -r requirements-mcp.txt
    startCommand: python mcp_http_server.py

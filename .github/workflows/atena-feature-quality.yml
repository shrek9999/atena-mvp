name: ATENA Coach Core Feature Tests
on:
  push:
    branches:
      - "feature/atena-coach-core-v3"
    paths:
      - "tests/**"
      - "training/**"
      - "coach_routes.py"
      - "requirements.txt"
      - ".github/workflows/atena-feature-quality.yml"
permissions:
  contents: read
jobs:
  program-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run full offline suite
        env:
          PYTHONPATH: .
        run: pytest -q

name: Publish ATENA to Official MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate server metadata
        run: ./mcp-publisher validate server.json
      - name: Check whether this version is already published
        id: registry-version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("server.json", encoding="utf-8"))["version"])')"
          STATUS="$(curl -sS -o /tmp/registry-version.json -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.shrek9999%2Fatena/versions/$VERSION")"
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION is already in the official registry; skipping duplicate publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "Version $VERSION is not published yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/registry-version.json
            echo "Unexpected registry response: HTTP $STATUS" >&2
            exit 1
          fi
      - name: Authenticate using GitHub OIDC
        if: steps.registry-version.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish ATENA version
        if: steps.registry-version.outputs.skip != 'true'
        run: ./mcp-publisher publish server.json

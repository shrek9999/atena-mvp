name: Publish ATENA to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - "mcp_http_server.py"
      - "mcp_requirements.txt"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish ATENA
        run: ./mcp-publisher publish server.json

      - name: Verify official registry listing
        run: |
          curl --fail --retry 8 --retry-delay 5             "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.shrek9999%2Fatena/versions/latest"             -o registry.json
          jq -e '.server.name == "io.github.shrek9999/atena"' registry.json
          jq -e '.server.remotes[] | select(.type == "streamable-http" and .url == "https://atena-mcp.onrender.com/mcp")' registry.json

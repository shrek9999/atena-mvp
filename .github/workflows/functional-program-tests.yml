name: ATENA Functional Programme Regression Tests
on:
  pull_request:
    paths:
      - "training/**"
      - "tests/test_catalogue_goal_logic.py"
      - "tests/test_program_quality_gate.py"
      - "tests/test_program_generator.py"
      - "tests/test_program_quality_matrix.py"
      - "tests/test_program_context.py"
      - "requirements.txt"
      - ".github/workflows/functional-program-tests.yml"
permissions:
  contents: read
jobs:
  functional-program-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run focused functional programme tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_catalogue_goal_logic.py tests/test_program_quality_gate.py tests/test_program_generator.py tests/test_program_quality_matrix.py tests/test_program_context.py

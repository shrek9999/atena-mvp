name: ATENA programme quality matrix

on:
  pull_request:
    branches:
      - pilot/website-ai-coach
    paths:
      - "training/**"
      - "tests/test_program_generator.py"
      - "requirements.txt"
      - ".github/workflows/program-quality-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  programme-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run programme generator tests
        run: python -m pytest -q tests/test_program_generator.py

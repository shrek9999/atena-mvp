name: ATENA agent benchmark support
on:
  workflow_dispatch:
jobs:
  atena-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ATENA arm on 30 blind cases
        run: |
          python - <<'PY'
          import json, urllib.request
          d=json.load(open("ATENA_v0.9_blind_benchmark_30.postman_collection.json"))
          url="https://atena-mvp.onrender.com/decision"
          for item in d["item"]:
              inp=json.loads(item["request"]["body"]["raw"])
              req=urllib.request.Request(url,data=json.dumps(inp).encode(),headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=30) as r: out=json.load(r)
              print(item["name"], "| ATENA=", out.get("decision"), "| confidence=", out.get("confidence"))
          PY

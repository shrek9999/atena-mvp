name: ATENA Decision Engine Tests
on:
  pull_request:
    paths:
      - "app.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/decision-engine-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run offline regression tests
        run: pytest -q

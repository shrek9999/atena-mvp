name: ATENA Decision Engine Tests # Includes offline regression tests and the ZEUS live MCP gate; zeus/** is covered
on:
  pull_request:
    paths:
      - "app.py"
      - "tests/**"
      - "scripts/**"
      - "zeus/**"
      - "requirements.txt"
      - "README.md"
      - "AGENT_DISCOVERY_AND_VALUE.md"
      - "server.json"
      - "agent_contract.json"
      - "openapi.json"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry metadata JSON
        run: python -m json.tool server.json > /dev/null
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run offline regression tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Read-only live ATENA MCP compatibility check
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/zeus-coordinator-skeleton'
        env:
          PYTHONPATH: .
        run: python scripts/atena_mcp_live_smoke.py

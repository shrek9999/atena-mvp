name: ATENA Decision Engine Tests
on:
  pull_request:
    paths:
      - "app.py"
      - "coach_routes.py"
      - "training/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "AGENT_DISCOVERY_AND_VALUE.md"
      - "server.json"
      - "agent_contract.json"
      - "openapi.json"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry metadata JSON
        run: python -m json.tool server.json > /dev/null
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run offline regression tests
        env:
          PYTHONPATH: .
        run: pytest -q

name: ATENA Decision Engine Tests
on:
  push:
    branches:
      - "feature/six-pattern-learning-engine"
  pull_request:
    paths:
      - "app.py"
      - "coach_routes.py"
      - "training/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "AGENT_DISCOVERY_AND_VALUE.md"
      - "server.json"
      - "agent_contract.json"
      - "openapi.json"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry metadata JSON
        run: python -m json.tool server.json > /dev/null
      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run offline regression tests
        env:
          PYTHONPATH: .
        run: pytest -q


  pilot-token-presence:
    name: Diagnose pilot token configuration without revealing credentials
    runs-on: ubuntu-latest
    steps:
      - name: Distinguish missing Render token from configured token
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"messages":[]}' \
            https://atena-ai-coach-pilot.onrender.com/coach/chat)
          echo "Unauthenticated pilot endpoint returned HTTP ${status}."
          if [ "$status" = "503" ]; then
            echo "Diagnosis: Render does not have AI_COACH_TEST_TOKEN configured."
          elif [ "$status" = "403" ]; then
            echo "Diagnosis: Render has a token configured; the unauthenticated request was correctly rejected."
          else
            echo "Diagnosis: unexpected response; investigate endpoint or service state."
            exit 1
          fi

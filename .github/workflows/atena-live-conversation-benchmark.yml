name: ATENA live conversation quality benchmark
# Live model calls are opt-in through explicit commit markers or manual workflow dispatch.

on:
  push:
    branches:
      - pilot/website-ai-coach
      - feature/six-pattern-learning-engine
    paths:
      - "tests/fixtures/conversation_quality_benchmark_v1.json"
      - "tests/run_live_conversation_quality_benchmark.py"
      - ".github/workflows/atena-live-conversation-benchmark.yml"
      - "coach_routes.py"
      - "tests/test_conversation_state_regressions.py"
  workflow_dispatch:
    inputs:
      scenario_set:
        description: "Run the full suite, focused subset, or targeted post-review regressions"
        required: true
        type: choice
        options:
          - focused
          - targeted
          - full
        default: focused
      repeat_count:
        description: "Independent repetitions (full suite: 69 turns per repetition)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"

concurrency:
  group: atena-live-gemini-coaching
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-conversation-benchmark:
    name: Run manually selected multi-turn coaching scenarios
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[run-live-benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_COACH_TEST_TOKEN: ${{ secrets.AI_COACH_TEST_TOKEN }}
      ATENA_BENCHMARK_BACKEND: https://atena-ai-coach-pilot.onrender.com
      ATENA_BENCHMARK_SCENARIOS: ${{ (inputs.scenario_set == 'full' || contains(github.event.head_commit.message || '', '[full-benchmark]')) && 'ALL' || (inputs.scenario_set == 'targeted' || contains(github.event.head_commit.message || '', '[targeted-benchmark]')) && 'G04,G10,G12,G17,G19' || 'G01,G02,G03,G04,G05,G06,G10,G11,G13,G14,G19,G20,G21,G23' }}
      ATENA_BENCHMARK_REPEATS: ${{ inputs.repeat_count || (contains(github.event.head_commit.message || '', '[full-benchmark]') && '1' || contains(github.event.head_commit.message || '', '[targeted-benchmark]') && '1' || '2') }}
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Render staging deployment to finish
        if: github.event_name == 'push'
        run: sleep 150

      - name: Confirm live backend and pilot credential
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("AI_COACH_TEST_TOKEN", "").strip()
          if len(token) < 16:
              sys.exit("GitHub Actions secret AI_COACH_TEST_TOKEN is missing or too short.")
          request = urllib.request.Request(
              "https://atena-ai-coach-pilot.onrender.com/coach/status",
              headers={"X-Pilot-Token": token},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = json.loads(response.read().decode("utf-8"))
          if not data.get("chat_available"):
              sys.exit("ATENA chat is not reported as available.")
          print("Live Render chat endpoint is available; secret was not printed.")

      - name: Run live multi-turn benchmark
        run: |
          echo "Scenario selection: $ATENA_BENCHMARK_SCENARIOS"
          echo "Independent repetitions: $ATENA_BENCHMARK_REPEATS"
          python tests/run_live_conversation_quality_benchmark.py

      - name: Upload full transcripts and run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atena-live-conversation-benchmark
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14

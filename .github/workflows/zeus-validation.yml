name: ZEUS validation

on:
  pull_request:
    branches:
      - architecture/zeus-agent-coordination
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Python tests
        run: python -m pytest -q

  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Worker syntax
        run: node --check cloudflare/zeus-ledger-worker/src/index.js
      - name: Run Worker tests
        run: node --test cloudflare/zeus-ledger-worker/test/worker.test.mjs

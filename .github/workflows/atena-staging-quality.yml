name: ATENA Staging Program Quality Matrix
# Regression gate includes coaching-language checks on the current pilot branch.
on:
  push:
    branches:
      - "pilot/website-ai-coach"
      - "feature/six-pattern-learning-engine"
  pull_request:
    branches:
      - "pilot/website-ai-coach"
    paths:
      - "tests/**"
      - "coach_routes.py"
      - "coach_store.py"
      - "requirements.txt"
      - "training/**"
      - ".github/workflows/atena-staging-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  program-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run complete offline test suite
        env:
          PYTHONPATH: .
        run: pytest -q

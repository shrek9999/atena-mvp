name: ATENA Agent Pilot
on:
  push:
    paths:
      - "pilot/**"
      - ".github/workflows/agent_pilot.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model to evaluate"
        required: false
        default: "gpt-6-luna"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run blinded Agent vs Agent+ATENA pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          python -m pip install --quiet requests
          python pilot/run_agent_pilot.py
      - name: Upload raw pilot results
        uses: actions/upload-artifact@v4
        with:
          name: atena-agent-pilot-results
          path: pilot/results_raw.json
          retention-days: 30

name: ATENA Remote Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call production ATENA
        run: |
          python - <<'PY'
          import json, requests
          cases=[
            ("P01",{"goal":{"primary":"strength"},"state":{"strength_trend":"stable","rpe_trend":"stable","recovery":"good","sleep":"good","symptoms":"none"},"question":"Should volume be increased?","gold":"maintain"),
            ("P02",{"goal":{"primary":"strength"},"state":{"strength_change_pct":3,"rpe_trend":"decreasing","recovery":"good","sleep":"good","symptoms":"none"},"question":"Should I make a small progression?","gold":"progress"),
            ("P03",{"goal":{"primary":"strength"},"state":{"strength_change_pct":-3,"rpe_change":1,"recovery":"worse","sleep":"slightly worse","symptoms":"none"},"question":"What is the next decision?","gold":"reduce"),
            ("P04",{"goal":{"primary":"strength"},"state":{"performance_change_pct":-4,"rpe_trend":"stable","recovery":"normal","sleep":"normal","symptoms":"none","observation_count":1},"question":"What should I change?","gold":"collect_data"),
            ("P05",{"goal":{"primary":"strength"},"state":{"symptoms":"knee pain during squat","strength_trend":"stable","recovery":"good"},"question":"Should squat load be progressed?","gold":"modify"),
          ]
          for cid,p,gold in cases:
            p.update({"person":{},"constraints":{},"response":{},"history":{}})
            r=requests.post("https://atena-mvp.onrender.com/decision",json=p,timeout=60)
            r.raise_for_status()
            d=r.json()
            print(json.dumps({"case":cid,"expected":gold,"decision":d.get("decision"),"reason_codes":d.get("reason_codes"),"confidence":d.get("confidence")},ensure_ascii=False))
          PY

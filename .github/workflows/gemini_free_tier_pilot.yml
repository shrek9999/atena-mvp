name: ATENA Gemini Free-Tier Pilot
on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: 'Type I_CONFIRM_FREE_TIER only after confirming the project is still Free Tier and has no linked billing account'
        required: true
        type: string
      model:
        description: "Gemini model available on the project's Free Tier"
        required: true
        default: "gemini-3.5-flash-lite"
        type: string
      limit:
        description: "Cases to run (start with 1; hard maximum 5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
permissions:
  contents: read
jobs:
  pilot:
    if: ${{ inputs.confirm_free_tier == 'I_CONFIRM_FREE_TIER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded Gemini A/B pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          PILOT_LIMIT: ${{ inputs.limit }}
        run: |
          python -m pip install --quiet requests
          python pilot/run_gemini_agent_pilot.py
      - name: Upload partial or complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atena-gemini-pilot-results
          path: pilot/results_gemini_raw.json
          if-no-files-found: ignore
          retention-days: 7
